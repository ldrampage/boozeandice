<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

<head th:insert="~{fragments/head :: head}"></head>

<body class="crm_body_bg">

	<!-- main content part here -->

	<aside th:insert="~{fragments/sidebar :: sidebar}"></aside>

	<section class="main_content dashboard_part large_header_bg">
		<div th:insert="~{fragments/header :: header}"></div>
		<div class="main_content_iner overly_inner">
			<div class="container-fluid p-0 ">
				<!-- page title  -->
				<div class="row">
					<div class="col-12">
						<div class="page_title_box d-flex align-items-center justify-content-between">
							<div class="page_title_left">
								<h3 class="f_s_30 f_w_700 text_white">Invoice</h3>
								<ol class="breadcrumb page_bradcam mb-0">
									<li class="breadcrumb-item"><a href="javascript:void(0);">Booze and Ice</a></li>
									<li class="breadcrumb-item"><a href="javascript:void(0);"></a>Invoice</li>
								</ol>
							</div>
						</div>
					</div>
				</div>

				<div class="row ">
					<div class="col-12 QA_section">
						<div class="card QA_table ">
							<div class="card-header">
								Invoice: 
								<strong th:text="${transaction.invoiceNumber}"></strong>
								<span class="float-end"> <strong>Status:</strong>&nbsp;<span class="float-end" th:text="${transaction.transactionStatus}"></span></span>

							</div>
							<div class="card-body">
								<!--<div class="row mb-4">
									<div class="col-sm-6">
										<h6 class="mb-3">From:</h6>
										<div>
											<strong>Person 1</strong>
										</div>
										<div>England</div>
										<div>71-101 Szczecin, England</div>
										<div>Email: demo@gmail.com</div>
										<div>Phone: +0000</div>
									</div>

									<div class="col-sm-6">
										<h6 class="mb-3">To:</h6>
										<div>
											<strong>Person 2</strong>
										</div>
										<div>England</div>
										<div>71-101 Szczecin, England</div>
										<div>Email: demo@gmail.com</div>
										<div>Phone: +0000</div>
									</div>



								</div>-->

								<div class="table-responsive-sm">
									<table class="table table-striped">
										<thead>
											<tr>
												<th class="center">#</th>
												<th>Item</th>
												<th>Description</th>
												<th class="right">Unit Cost</th>
												<th class="center">Qty</th>
												<th class="right">Total</th>
											</tr>
										</thead>
										<tbody>
											<tr th:each="transactionItem : ${transaction.transactionItem}">
												<td class="center" th:text="${transactionItem.product.id}"></td>
												<td class="left strong" th:text="${transactionItem.product.name}"></td>
												<td class="left" th:text="${transactionItem.product.description}"></td>

												<td class="right" th:text="${'Php ' + transactionItem.product.price}">
												</td>
												<td class="center" th:text="${transactionItem.quantity}"></td>
												<td class="right"
													th:text="${'Php ' + transactionItem.product.price * transactionItem.quantity}">
												</td>
											</tr>
										</tbody>
									</table>
								</div>
								<div class="row">
									<div class="col-lg-4 col-sm-5 QA_section">
										<table class="table table-clear QA_table">
											<tbody>
												<tr>
													<td class="left">
														<strong>Transaction Date and Time</strong>
													</td>
													<td class="right"><strong th:text="${transaction.transactionDateTime}"></strong></td>
												</tr>
												<tr>
													<td class="left">
														<strong>Subtotal</strong>
													</td>
													<td class="right" th:text="${transaction.subTotal}"></td>
												</tr>
												<tr>
													<td class="left">
														<strong>Shipping</strong>
													</td>
													<td class="right" th:text="${transaction.shipping}"></td>
												</tr>
												<tr>
													<td class="left">
														<strong>VATale Sales</strong>
													</td>
													<td class="right" th:text="${transaction.vatableSales}"></td>
												</tr>
												<tr>
													<td class="left">
														<strong>VAT (12%)</strong>
													</td>
													<td class="right" th:text="${transaction.vatAmount}"></td>
												</tr>
												<tr>
													<td class="left">
														<strong>Total</strong>
													</td>
													<td class="right">
														<strong style="font-size: 24px;" th:text="${transaction.total}"></strong>
													</td>
												</tr>
												<tr>
													<td class="left">
														<strong>Cash Received</strong>
													</td>
													<td class="right">
														<strong style="font-size: 24px;" th:text="${transaction.cashReceived}"></strong>
													</td>
												</tr>
												<tr>
													<td class="left">
														<strong>Change</strong>
													</td>
													<td class="right">
														<strong style="font-size: 24px;" th:text="${transaction.cashReceived - transaction.total}"></strong>
													</td>
												</tr>
											</tbody>
										</table>

									</div>
									<div class="col-lg-4 col-sm-5">

									</div>

								</div>

							</div>
						</div>
					</div>
				</div>
			</div>
		</div>

		<!-- footer part -->
		<div th:insert="~{fragments/footer :: footer}"></div>
	</section>
	<!-- main content part end -->

	<div id="back-top" style="display: none;">
		<a title="Go to Top" href="#">
			<i class="ti-angle-up"></i>
		</a>
	</div>
	<div th:insert="~{fragments/footer-scripts :: footer}"></div>
	<script>
		// Get the current date
		var currentDate = new Date();

		// Format the date as desired (e.g., "YYYY-MM-DD")
		var formattedDate = currentDate.toISOString().split('T')[0];

		// Update the content of the HTML element with the formatted date
		document.getElementById("currentDate").textContent = formattedDate;
	</script>
</body>

</html>
