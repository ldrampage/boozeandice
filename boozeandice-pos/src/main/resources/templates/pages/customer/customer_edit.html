<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

<head th:insert="~{fragments/head :: head}"></head>

<body class="hold-transition sidebar-mini layout-fixed sidebar-collapse">
	<div class="wrapper">

		<div th:insert="~{fragments/preload :: preload}"></div>
		<div th:insert="~{fragments/header :: header}"></div>
		<div th:insert="~{fragments/sidebar :: sidebar}"></div>


		<!-- Content Wrapper. Contains page content -->
		<div class="content-wrapper">
			<!-- Content Header (Page header) -->
			<div class="content-header">
				<div class="container-fluid">
					<div class="row mb-2">
						<div class="col-sm-6">
							<h1 class="m-0">Customer</h1>
						</div><!-- /.col -->
						<div class="col-sm-6">
							<ol class="breadcrumb float-sm-right">
								<li class="breadcrumb-item"><a href="#">Customer Edit</a></li>
							</ol>
						</div><!-- /.col -->
					</div><!-- /.row -->
				</div><!-- /.container-fluid -->
			</div>
			<!-- /.content-header -->

			<!-- Main content -->
			<section class="content">
				<div class="container-fluid">

					<div th:if="${message != null and message['status'] == 'success'}"
						class="alert alert-success alert-dismissible">
						<button type="button" class="close" data-dismiss="alert" aria-hidden="true">&times;</button>
						<h4 class="alert-heading">Well done!</h4>
						<p>Aww yeah, you successfully edited customer. Click <a th:href="${'/customer'}">here</a> to see
							it.</p>
					</div>

					<div th:if="${message != null and message['status'] == 'error'}"
						class="alert alert-danger alert-dismissible">
						<button type="button" class="close" data-dismiss="alert" aria-hidden="true">&times;</button>
						<h4 class="alert-heading">Something went wrong!</h4>
						<p th:text="${message['message']}"></p>
					</div>
					
					<div class="row">
						<div class="col-md-12">
							<div class="card card-primary">
								<div class="card-header">
									<h3 class="card-title">Edit customer details</h3>

									<div class="card-tools">
										<button type="button" class="btn btn-tool" data-card-widget="collapse"
											title="Collapse">
											<i class="fas fa-minus"></i>
										</button>
									</div>
								</div>
								<div class="card-body">
									<form method="post" th:action="@{/customer/edit}"
										enctype="multipart/form-data">
										<div class="row">
											<div class="col-md-4">
												<div class="form-group">
													<label for="name">Name</label>
													<input type="text" th:value="${customer.name}" id="name" name="name" class="form-control"
														required>
												</div>
											</div>
										</div>

										<div class="row">
											<div class="col-md-4">
												<div class="form-group">
													<label for="mobile_number">Mobile Number</label>
													<input type="text" th:value="${customer.phoneNumber}" id="mobile_number" name="mobile_number"
														class="form-control">
												</div>
											</div>
											<div class="col-md-4">
												<div class="form-group">
													<label for="mobile_number">Email address</label>
													<input type="email" th:value="${customer.emailAddress}" id="email_address" name="email_address"
														class="form-control">
												</div>
											</div>
											<!--<div class="col-md-4">
												<div class="form-group">
													<label class="form-label" for="name">Profile picture</label>
													<div class="custom-file">
														<input type="file" class="custom-file-input" id="file"
															name="file" />
														<label class="custom-file-label" for="file">Image
															File</label>
													</div>
												</div>
											</div> -->
										</div>
										<div class="row">
											<div class="col-md-2">
												<div class="form-group">
													<input type="submit" value="Edit" name="edit_customer_btn"
														class="btn btn-block btn-success">
												</div>
											</div>
										</div>
									</form>
								</div>
								<!-- /.card-body -->
							</div>
							<!-- /.card -->
						</div>
					</div>

				</div><!-- /.container-fluid -->
			</section>
			<!-- /.content -->

		</div>
		<!-- /.content-wrapper -->
	</div>
	<!-- ./wrapper -->
	<div th:insert="~{fragments/footer :: footer}"></div>
	<div th:insert="~{fragments/footer-scripts :: footer}"></div>

</body>

</html>
