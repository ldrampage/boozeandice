<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

<head>
	<!-- Google Font: Source Sans Pro -->
	<link rel="stylesheet"
		href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback">
	<!-- Font Awesome -->
	<link rel="stylesheet" th:href="@{/plugins/fontawesome-free/css/all.min.css}">
	<!-- Theme style -->
	<link rel="stylesheet" th:href="@{/dist/css/adminlte.min.css}">
	<style>
		@page {
			size: 48mm 210mm;
			margin: 0;
		}

		body {
			margin: 0;
			align-items: center;
			justify-content: center;
			min-height: 100vh;
		}

		.invoice {
			padding: 20px;
			font-size: 12px;
			font-family: monospace;
		}
	</style>

</head>

<body class="hold-transition sidebar-mini layout-fixed sidebar-collapse">
	<div class="wrapper">

		<div th:insert="~{fragments/header :: header}"></div>
		<div th:insert="~{fragments/sidebar :: sidebar}"></div>


		<!-- Content Wrapper. Contains page content -->
		<div class="wrapper">
			<!-- Main content -->
			<div class="content-wrapper ">
			<section class="invoice col-md-2">
				<b th:text="${business_name}"></b>
				<p style="margin-bottom:0px; " th:text="${business_address}"></p>
				<p>Z-REPORT</p>
				<p style="margin-bottom:0px; margin-top:0px;">**********************</p>
				<p style="margin-bottom:0px; margin-top:0px;">SALES AND TAX SUMMARY</p>
				

				
				<!-- TODO IT COMPANY SECTION -->
			</section>
			<!-- /.content -->
			</div>
		</div>
		<!-- /.content-wrapper -->
	</div>
	<!-- ./wrapper -->
	<div th:insert="~{fragments/footer-scripts :: footer}"></div>
	<script>
		window.addEventListener("load", window.print());
	</script>
</body>

</html>
