<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

<head th:insert="~{fragments/head :: head}"></head>

<body class="hold-transition sidebar-mini layout-fixed sidebar-collapse">
	<div class="wrapper">

		<div th:insert="~{fragments/preload :: preload}"></div>
		<div th:insert="~{fragments/header :: header}"></div>
		<div th:insert="~{fragments/sidebar :: sidebar}"></div>


		<!-- Content Wrapper. Contains page content -->
		<div class="content-wrapper">
			<!-- Content Header (Page header) -->
			<div class="content-header">
				<div class="container-fluid">
					<div class="row mb-2">
						<div class="col-sm-6">
							<h1 class="m-0">Reports</h1>
						</div><!-- /.col -->
						<div class="col-sm-6">
							<ol class="breadcrumb float-sm-right">
								<li class="breadcrumb-item"><a href="#">Reports</a></li>
							</ol>
						</div><!-- /.col -->
					</div><!-- /.row -->
				</div><!-- /.container-fluid -->
			</div>
			<!-- /.content-header -->

			<!-- Main content -->
			<section class="content">
				<div class="container-fluid">
					<!-- ./row -->
					<div class="row">
						<div class="col-12 col-sm-12">
							<div class="card card-primary card-tabs">
								<div class="card-header p-0 pt-1">
									<ul class="nav nav-tabs" id="custom-tabs-one-tab" role="tablist">
										<li class="nav-item">
											<a th:attr="class=nav-link + ${lastaction == null ? ' active' : ''}" 
												id="custom-tabs-one-salesreport-tab" data-toggle="pill"
												href="#custom-tabs-one-salesreport" role="tab"
												aria-controls="custom-tabs-one-salesreport"
												aria-selected="false">Sales Report</a>
										</li>
									</ul>
								</div>
								<div class="card-body">
									<div class="tab-content " id="custom-tabs-one-tabContent">
										<div th:attr="class=tab-pane + ' fade' + ${lastaction == null ? ' show active' : ''}" id="custom-tabs-one-salesreport" role="tabpanel"
											aria-labelledby="custom-tabs-one-salesreport-tab">

											<div class="row">
												<div class="col-md-12">
													<div class="card">
														<div class="card-header">
															<h3 class="card-title">Daily Sales Report</h3>
															<!--<small class="float-right">
																<a th:href="${'/product/products/add'}"
																	class="btn btn-info">Add Product</a>
															</small> -->
														</div>
														<div class="card-body">
															<table id="daily_sales_report_table"
																class="table table-bordered table-striped">
																<thead>
																	<tr>
																		<th scope="col">Date</th>
																		<th scope="col">Total</th>
																		<th scope="col">Cash</th>
																		<th scope="col">Gcash</th>
																		<th scope="col">Paymaya</th>
																		<th scope="col">Cost</th>
																		<th scope="col">Profit</th>
																		<th scope="col">Taxes</th>
																		<th scope="col">Expenses</th>
																		<th scope="col">No. of Transactions</th>
																		<th scope="col">No. of Items</th>
																	</tr>
																</thead>
																<tbody>
																	<tr th:if="${dailySalesReportList != null}" th:each="dailySalesReport : ${dailySalesReportList}">
																		<td><span th:text="${dailySalesReport.date}"></span></td>
																		<td><span th:text="${'P'+dailySalesReport.total}"></span></td>
																		<td><span th:text="${'P'+dailySalesReport.cashTransaction}"></span></td>
																		<td><span th:text="${'P'+dailySalesReport.gcashTransaction}"></span></td>
																		<td><span th:text="${'P'+dailySalesReport.cardTransaction}"></span></td>
																		<td><span th:text="${'P'+dailySalesReport.cost}"></span></td>
																		<td><span th:text="${'P'+dailySalesReport.profit}"></span></td>
																		<td><span th:text="${'P'+dailySalesReport.taxes}"></span></td>
																		<td>
																			<span th:if="${dailySalesReport.expenses != null}" th:text="${'P'+dailySalesReport.expenses}"></span>
																			<span th:unless="${dailySalesReport.expenses != null}">P0.00</span>
																		</td>
																		<td><span th:text="${dailySalesReport.noOfTransactions}"></span></td>
																		<td><span th:text="${dailySalesReport.noOfItems}"></span></td>
																	</tr>
																
																</tbody>
															</table>
														</div>

													</div>
												</div>
											</div>
										</div>
									</div>
								</div>
								<!-- /.card -->
							</div>
						</div>
					</div>
				</div><!-- /.container-fluid -->
			</section>
			<!-- /.content -->
		</div>
		<!-- /.content-wrapper -->
	</div>
	<!-- ./wrapper -->
	<div th:insert="~{fragments/footer :: footer}"></div>
	<div th:insert="~{fragments/footer-scripts :: footer}"></div>
	
	<!-- DataTables  & Plugins -->
	<script th:src="@{/plugins/datatables/jquery.dataTables.min.js}"></script>
	<script th:src="@{/plugins/datatables-bs4/js/dataTables.bootstrap4.min.js}"></script>
	<script th:src="@{/plugins/datatables-responsive/js/dataTables.responsive.min.js}"></script>
	<script th:src="@{/plugins/datatables-responsive/js/responsive.bootstrap4.min.js}"></script>
	<script th:src="@{/plugins/datatables-buttons/js/dataTables.buttons.min.js}"></script>
	<script th:src="@{/plugins/datatables-buttons/js/buttons.bootstrap4.min.js}"></script>
	<script th:src="@{/plugins/jszip/jszip.min.js}"></script>
	<script th:src="@{/plugins/pdfmake/pdfmake.min.js}"></script>
	<script th:src="@{/plugins/pdfmake/vfs_fonts.js}"></script>
	<script th:src="@{/plugins/datatables-buttons/js/buttons.html5.min.js}"></script>
	<script th:src="@{/plugins/datatables-buttons/js/buttons.print.min.js}"></script>
	<script th:src="@{/plugins/datatables-buttons/js/buttons.colVis.min.js}"></script>
	
	<script>
		$(document).ready(function () {
			
			$("#daily_sales_report_table").DataTable({
				responsive: true, 
				lengthChange: false, 
				autoWidth: false,
				buttons: ['csv'], //["copy", "csv", "excel", "pdf", "print", "colvis"],
				searching: true,
				order: [0,'desc']

			})

		})


	</script>
</body>

</html>
