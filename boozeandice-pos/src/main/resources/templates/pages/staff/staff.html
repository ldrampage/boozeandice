<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

<head th:insert="~{fragments/head :: head}"></head>

<body class="hold-transition sidebar-mini layout-fixed sidebar-collapse">
	<div class="wrapper">

		<div th:insert="~{fragments/preload :: preload}"></div>
		<div th:insert="~{fragments/header :: header}"></div>
		<div th:insert="~{fragments/sidebar :: sidebar}"></div>


		<!-- Content Wrapper. Contains page content -->
		<div class="content-wrapper">
			<!-- Content Header (Page header) -->
			<div class="content-header">
				<div class="container-fluid">
					<div class="row mb-2">
						<div class="col-sm-6">
							<h1 class="m-0">Staff</h1>
						</div><!-- /.col -->
						<div class="col-sm-6">
							<ol class="breadcrumb float-sm-right">
								<li class="breadcrumb-item"><a href="#">Staff</a></li>
							</ol>
						</div><!-- /.col -->
					</div><!-- /.row -->
				</div><!-- /.container-fluid -->
			</div>
			<!-- /.content-header -->

			<!-- Main content -->
			<section class="content">
				<div class="container-fluid">
					<div class="row">
						<div class="col-lg-2">
							<div class="form-group">
								<form method="post" th:action="@{/staff/createaccount}">
									<input class="btn btn-primary btn-lg" type="submit" value="Create Account"
										name="create_account">
								</form>
							</div>
						</div>
					</div>
					<!-- Default box -->
					<div class="card card-solid">
						<div class="card-body pb-0">
							<div class="row">
								<div class="col-12 col-sm-6 col-md-4 d-flex align-items-stretch flex-column"
									th:each="staff : ${staffList}">
									<div class="card bg-light d-flex flex-fill">
										<div th:text="${staff.jobPosition != null ? staff.jobPosition.name : ''}"
											class="card-header text-muted border-bottom-0">
										</div>
										<div class="card-body pt-0">
											<div class="row">
												<div class="col-7">
													<h2 class="lead"><b
															th:text="${staff.fname + ' ' + staff.lname}"></b></h2>
													<h6 class="text-muted text-sm"><b>Username: </b> <span
															th:text="${staff.username}"></span></h6>
													<p class="text-muted text-sm"><b>About: </b> <span
															th:text="${staff.about}"></span></p>

													<ul class="ml-4 mb-0 fa-ul text-muted">
														<li class="small"><span class="fa-li"><i
																	class="fas fa-lg fa-building"></i></span> Address:
															Demo Street 123, Demo City 04312, NJ</li>
														<li class="small"><span class="fa-li"><i
																	class="fas fa-lg fa-phone"></i></span>
															<span th:text="${staff.mobileNumber}">
															</span>
														</li>
													</ul>
												</div>
												<div class="col-5 text-center">
													<img th:src="@{'/images/profile/' + ${staff.imgLocation}}" alt="user-avatar"
														class="img-circle img-fluid" style="width:60%;">
												</div>
											</div>
										</div>
										<div class="card-footer">
											<div class="text-right">
												<a href="#" class="btn btn-sm bg-teal">
													<i class="fas fa-comments"></i>
												</a>
												<a th:href="@{'/staff/profileview/?id='+${staff.id}}" class="btn btn-sm btn-primary">
													<i class="fas fa-user"></i> View Profile
												</a>
												<!--<form style="display: inline;" method="post"
													th:action="@{/staff/editaccount}">
													<button type="submit" class="btn btn-sm btn-warning">
														<i class="fas fa-edit"></i> Edit Profile </button>
												</form> -->
												<form style="display: inline;" method="post"
													th:action="@{/staff/removeaccount}">
													<button type="submit" class="btn btn-sm btn-danger">
														<i class="fas fa-trash"></i> Deactivate Profile
													</button>
												</form>
											</div>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>

				</div><!-- /.container-fluid -->
			</section>
			<!-- /.content -->
		</div>
		<!-- /.content-wrapper -->
	</div>
	<!-- ./wrapper -->
	<div th:insert="~{fragments/footer :: footer}"></div>
	<div th:insert="~{fragments/footer-scripts :: footer}"></div>
</body>

</html>
