<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

<head th:insert="~{fragments/head :: head}"></head>

<body class="hold-transition sidebar-mini layout-fixed sidebar-collapse">
	<div class="wrapper">

		<div th:insert="~{fragments/preload :: preload}"></div>


		<div th:insert="~{fragments/header :: header}"></div>
		<div th:insert="~{fragments/sidebar :: sidebar}"></div>


		<!-- Content Wrapper. Contains page content -->
		<div class="content-wrapper">
			<!-- Content Header (Page header) -->
			<div class="content-header">
				<div class="container-fluid">
					<div class="row mb-2">
						<div class="col-sm-6">
							<h1 class="m-0">Inventory</h1>
						</div><!-- /.col -->
						<div class="col-sm-6">
							<ol class="breadcrumb float-sm-right">
								<li class="breadcrumb-item"><a href="#">Product View</a></li>
							</ol>
						</div><!-- /.col -->
					</div><!-- /.row -->
				</div><!-- /.container-fluid -->
			</div>
			<!-- /.content-header -->

			<!-- Main content -->
			<section class="content">
				<div class="container-fluid">
					<div class="row">
						<div class="col-md-12">
							<div class="card">
								<div class="card-body">
									<div class="row">
										<div class="col-lg-6 align-self-center">
											<img th:src="@{/images/} + ${product.imgLocation}" alt="No Image Available"
												class="mx-auto d-block sm_w_100" height="300" />
										</div>
										<div class="col-lg-6 align-self-center">
											<div class="single-pro-detail">
												<!--<p class="mb-1">Dastyle</p>
                                            <div class="custom-border mb-3"></div>-->
												<h3 class="pro-title" th:text="${product.name}"></h3>
												<p class="text-muted mb-0" th:text="${product.description}"></p>
												<!--<ul class="list-inline mb-2 product-review">
                                                <li class="list-inline-item"><i class="fas fa-star text-warning"></i></li>
                                                <li class="list-inline-item"><i class="fas fa-star text-warning"></i></li>
                                                <li class="list-inline-item"><i class="fas fa-star text-warning"></i></li>
                                                <li class="list-inline-item"><i class="fas fa-star text-warning"></i></li>
                                                <li class="list-inline-item"><i class="fas fa-star-half text-warning"></i></li>
                                                <li class="list-inline-item">4.5 (9830 reviews)</li>
                                            </ul> -->
												<h2 class="pro-price" th:text="${'Php ' + product.price}">
													<span>
														<del>$180.00</del>
													</span><span class="text-danger fw-bold ms-2">50% Off</span>
												</h2>
												<h6 class="text-muted font_s_13 mt-2 mb-1"
													th:text="${'Stocks available : ' + product.stocks}"></h6>
												<h6 class="text-muted font_s_13 mt-2 mb-1"
													th:if="${product.productCategory != null}"
													th:text="${'Category : ' + product.productCategory.name}"></h6>
												<h6 class="text-muted font_s_13 mt-2 mb-1"
													th:if="${product.supplier != null}"
													th:text="${'Supplier : ' + product.supplier}"></h6>
												<!--<ul class="list-unstyled pro-features border-0">
                                                <li>It is a long established fact that a reader will be distracted.</li>
                                                <li>Contrary to popular belief, Lorem Ipsum is not text.</li>
                                            </ul> 
                                            <h6 class="text-muted font_s_13 d-inline-block align-middle me-2">Color :</h6>
                                            <div class="radio2 radio-info2 form-check-inline ms-2">
                                                <input type="radio" id="inlineRadio1" value="option1" name="radioInline" checked="" /> 
                                                <label class="form-label" for="inlineRadio1"></label>
                                            </div>
                                            <div class="radio2 radio-dark2 form-check-inline">
                                                <input type="radio" id="inlineRadio2" value="option2" name="radioInline" /> 
                                                <label class="form-label" for="inlineRadio2"></label>
                                            </div>
                                            <div class="quantity mt-3">
                                                <input class="form-control form-control-sm" type="number" min="0" value="0" id="example-number-input" />
                                                <a href="" class="btn green_bg text-white px-4 d-inline-block ">
                                                    <i class="fa fa-cart-plus me-2"></i>Add to Cart
                                                </a>
                                            </div>-->
											</div>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>

					<div class="row">
						<div class="col-md-12">
							<div class="card">
								<div class="card-header">
									<h3 class="card-title">Stock List</h3>
								</div>
								<div class="card-body">
									<div class="row">
										<div class="col-md-12">
											<div class="table-responsive-sm">
												<table class="table table-striped">
													<thead>
														<tr>
															<th class="center">#</th>
															<th>Batch Date</th>
															<th>Purchase Date</th>
															<th class="right">Cost</th>
															<th class="center">Qty</th>
															<th class="right">Created By</th>
															<th class="right">Notes</th>
														</tr>
													</thead>
													<tbody>
														<tr th:each="productStock : ${productStockList}">
															<td class="center" th:text="${productStock.id}">
															</td>
															<td class="left strong"
																th:text="${productStock.createdDate}"></td>
															<td class="left" th:text="${productStock.purchaseDate}">
															</td>
															<td class="right" th:text="${'Php ' + productStock.cost}">
															</td>
															<td class="center" th:text="${productStock.quantity}"></td>
															<td class="right"
																th:text="${productStock.createdBy.username}">
															</td>
															<td class="right" th:text="${productStock.notes}">
															</td>
														</tr>

													</tbody>
												</table>
											</div>
										</div>
									</div>
									<div class="row">
										<div class="col-md-4">
											<table class="table table-clear QA_table">
												<tbody>
													<tr>
														<td class="left">
															<strong>Total Cost</strong>
														</td>
														<td class="right">
															<strong th:text="${'Php ' + totalCost}"></strong>
														</td>
													</tr>
												</tbody>
											</table>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
		</div><!-- /.container-fluid -->
		</section>
		<!-- /.content -->
	</div>
	<!-- /.content-wrapper -->
	</div>
	<!-- ./wrapper -->
	<div th:insert="~{fragments/footer :: footer}"></div>
	<div th:insert="~{fragments/footer-scripts :: footer}"></div>
</body>

</html>
