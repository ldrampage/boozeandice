<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

<head th:insert="~{fragments/head :: head}"></head>

<body class="crm_body_bg">

	<!-- main content part here -->

	<aside th:insert="~{fragments/sidebar :: sidebar}"></aside>

	<section class="main_content dashboard_part large_header_bg">
		<div th:insert="~{fragments/header :: header}"></div>
		<div class="main_content_iner overly_inner">
			<div class="container-fluid p-0 ">
				<!-- page title  -->
				<div class="row">
					<div class="col-12">
						<div class="page_title_box d-flex align-items-center justify-content-between">
							<div class="page_title_left">
								<h3 class="f_s_30 f_w_700 text_white">Product</h3>
								<ol class="breadcrumb page_bradcam mb-0">
									<li class="breadcrumb-item"><a th:href="${'/'}">Booze and Ice </a></li>
									<li class="breadcrumb-item"><a href="javascript:void(0);">Product</a></li>
									<li class="breadcrumb-item active"><a th:href="${'/product/stocks'}">Product
											Stock List</a></li>
									<li class="breadcrumb-item ">Add Product Stock</li>
								</ol>
							</div>
						</div>
					</div>
				</div>

				<div class="col-lg-12" th:if="${message != null and message['status'] == 'success'}">
					<div class="white_box mb_30">
						<div class="box_header ">
							<div class="main-title">
								<h3 class="mb-0">Additional Notifications</h3>
							</div>
						</div>
						<div class="alert alert-success" role="alert">
							<h4 class="alert-heading">Well done!</h4>
							<p>Aww yeah, you successfully added a new batch of product. Go to the <a
									th:href="${'/product/stocks'}">product stock list</a>to see it.</p>
						</div>
					</div>
				</div>

				<div class="col-lg-12" th:if="${message != null and message['status'] == 'error'}">
					<div class="white_box mb_30">
						<div class="box_header ">
							<div class="main-title">
								<h3 class="mb-0">Additional Notifications</h3>
							</div>
						</div>
						<div class="alert alert-danger" role="alert">
							<h4 class="alert-heading">Something went wrong!</h4>
							<p th:text="${message['message']}"></p>
						</div>
					</div>
				</div>

				<div class="row justify-content-center">
					<div class="col-lg-12">
						<div class="white_card card_height_100 mb_30">
							<div class="white_card_header">
								<div class="box_header m-0">
									<div class="main-title">
										<h3 class="m-0">Add new batch of stock</h3>
									</div>
								</div>
							</div>
							<div class="white_card_body">
								<div class="card-body">
									<form method="post" th:action="@{/product/stocks/add}"
										enctype="multipart/form-data">
										<div class="row mb-3">
											<div class=" col-md-4">
												<label class="form-label" for="product">Product</label>
												<select class="form-select" id="product" name="product">
													<option th:each="product : ${productList}"
														th:value="${product.id}" th:text="${product.name}"
														th:selected="${productId != null and product.id == productId}">
													</option>
												</select>
											</div>
											<div class=" col-md-4">
												<label class="form-label" for="quantity">Quantity</label>
												<input type="number" class="form-control" id="quantity" name="quantity"
													step="0" min="0" placeholder="quantity" required>
											</div>
											<div class=" col-md-4">
												<label class="form-label" for="cost">Cost</label>
												<input type="number" class="form-control" id="cost" name="cost"
													step="0.01" min="0" placeholder="cost" required>
											</div>
										</div>
										<div class="row mb-3">
											<div class="col-md-12">
												<label class="form-label" for="purchasedate">Purchase Date</label>
												<input type="date" class="form-control" name="purchasedate" id="purchasedate" required>
											</div>
										</div>
										<div class="row mb-3">
											<div class=" col-md-12">
												<label class="form-label" for="notes">Notes</label>
												<textarea class="form-control" id="notes" name="notes"
													placeholder="notes"></textarea>
											</div>
										</div>
										<button type="submit" class="btn btn-primary">Submit</button>
									</form>
								</div>
							</div>
						</div>
					</div>
					<div class="col-12">

					</div>
				</div>
			</div>
		</div>

		<!-- footer part -->
		<div th:insert="~{fragments/footer :: footer}"></div>
	</section>
	<!-- main content part end -->

	<div id="back-top" style="display: none;">
		<a title="Go to Top" href="#">
			<i class="ti-angle-up"></i>
		</a>
	</div>
	<div th:insert="~{fragments/footer-scripts :: footer}"></div>
</body>

</html>
