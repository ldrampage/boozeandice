<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

<head th:insert="~{fragments/head :: head}"></head>

<body class="hold-transition sidebar-mini layout-fixed sidebar-collapse">
	<div class="wrapper">

		<div th:insert="~{fragments/preload :: preload}"></div>
		<div th:insert="~{fragments/header :: header}"></div>
		<div th:insert="~{fragments/sidebar :: sidebar}"></div>


		<!-- Content Wrapper. Contains page content -->
		<div class="content-wrapper">
			<!-- Content Header (Page header) -->
			<div class="content-header">
				<div class="container-fluid">
					<div class="row mb-2">
						<div class="col-sm-6">
							<h1 class="m-0">Inventory</h1>
						</div><!-- /.col -->
						<div class="col-sm-6">
							<ol class="breadcrumb float-sm-right">
								<li class="breadcrumb-item"><a href="#">Product Stock Add</a></li>
							</ol>
						</div><!-- /.col -->
					</div><!-- /.row -->
				</div><!-- /.container-fluid -->
			</div>
			<!-- /.content-header -->

			<!-- Main content -->
			<section class="content">
				<div class="container-fluid">

					<div th:if="${message != null and message['status'] == 'success'}"
						class="alert alert-success alert-dismissible">
						<button type="button" class="close" data-dismiss="alert" aria-hidden="true">&times;</button>
						<h4 class="alert-heading">Well done!</h4>
						<p>Aww yeah, you successfully added a new stock. Go to the <a
								th:href="${'/product/stocks'}">product stocks</a> see it.</p>
					</div>

					<div th:if="${message != null and message['status'] == 'error'}"
						class="alert alert-danger alert-dismissible">
						<button type="button" class="close" data-dismiss="alert" aria-hidden="true">&times;</button>
						<h4 class="alert-heading">Something went wrong!</h4>
						<p th:text="${message['message']}"></p>
					</div>

					<div class="row">
						<div class="col-md-12">
							<div class="card">
								<div class="card-header">
									<h3 class="card-title">Add Stock Form</h3>
								</div>
								<div class="card-body">
									<form method="post" th:action="@{/product/stocks/add}">
										<div class="row">
											<div class="col-md-4">
												<div class="form-group">
													<label class="form-label" for="product">Product</label>
													<select class="form-control select2" id="product" name="product">
														<option th:each="product : ${productList}"
															th:value="${product.id}" th:text="${product.name}"
															th:selected="${productId != null and product.id == productId}">
														</option>
													</select>
												</div>
											</div>
											<div class="col-md-2">
												<div class="form-group">
													<label class="form-label" for="quantity">Quantity</label>
													<input type="number" class="form-control" id="quantity"
														name="quantity" step="0" min="0" placeholder="quantity"
														required>
												</div>
											</div>
											<div class="col-md-2">
												<div class="form-group">
													<label class="form-label" for="cost">Cost</label>
													<input type="number" class="form-control" id="cost" name="cost"
														step="0.01" min="0" placeholder="cost" required>
												</div>
											</div>
										</div>
										<div class="row">
											<div class="col-md-4">
												<div class="form-group">
													<label class="form-label" for="purchasedate">Purchase Date</label>
													<input type="date" class="form-control" name="purchasedate"
														id="purchasedate" required>
												</div>
											</div>
											<div class="col-md-4">
												<div class="form-group">
													<label class="form-label" for="generatebarcode">Generate
														Barcode</label>
														<br>
													<input type="checkbox" class="form-control" name="generatebarcode" id="generatebarcode" data-bootstrap-switch>
												</div>
											</div>
										</div>
										<div class="row">
											<div class="col-md-12">
												<div class="form-group">
													<label class="form-label" for="notes">Notes</label>
													<textarea class="form-control" id="notes" name="notes"
														placeholder="notes"></textarea>
												</div>
											</div>
										</div>
										<div class="row">
											<div class="col-md-4">
												<div class="form-group">
													<button type="submit" class="btn btn-primary">Submit</button>
												</div>
											</div>
										</div>
									</form>
								</div>
							</div>
						</div>
					</div><!-- /.container-fluid -->
			</section>
			<!-- /.content -->
		</div>
		<!-- /.content-wrapper -->
	</div>
	<!-- ./wrapper -->
	<div th:insert="~{fragments/footer :: footer}"></div>
	<div th:insert="~{fragments/footer-scripts :: footer}"></div>
	<!-- Bootstrap Switch -->
	<script th:src="@{/plugins/bootstrap-switch/js/bootstrap-switch.min.js}"></script>
	<script>
		//Initialize Select2 Elements
		$('.select2').select2()

		$("input[data-bootstrap-switch]").each(function () {
			$(this).bootstrapSwitch('state', $(this).prop('checked'));
		})

	</script>
</body>

</html>
