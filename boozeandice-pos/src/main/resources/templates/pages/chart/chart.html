<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

<head th:insert="~{fragments/head :: head}"></head>

<body class="hold-transition sidebar-mini layout-fixed sidebar-collapse">
	<div class="wrapper">

		<div th:insert="~{fragments/preload :: preload}"></div>
		<div th:insert="~{fragments/header :: header}"></div>
		<div th:insert="~{fragments/sidebar :: sidebar}"></div>


		<!-- Content Wrapper. Contains page content -->
		<div class="content-wrapper">
			<!-- Content Header (Page header) -->
			<div class="content-header">
				<div class="container-fluid">
					<div class="row mb-2">
						<div class="col-sm-6">
							<h1 class="m-0">Charts</h1>
						</div><!-- /.col -->
						<div class="col-sm-6">
							<ol class="breadcrumb float-sm-right">
								<li class="breadcrumb-item"><a href="#">Charts</a></li>
							</ol>
						</div><!-- /.col -->
					</div><!-- /.row -->
				</div><!-- /.container-fluid -->
			</div>
			<!-- /.content-header -->

			<!-- Main content -->
			<section class="content">
				<div class="container-fluid">

					<div class="row">
						<div class="col-md-12">
							<div class="card card-success">
								<div class="card-header">
									<h3 class="card-title">Monthly Recap Chart for F.Y. 2023</h3>

									<div class="card-tools">
										<button type="button" class="btn btn-tool" data-card-widget="collapse">
											<i class="fas fa-minus"></i>
										</button>
										<button type="button" class="btn btn-tool" data-card-widget="remove">
											<i class="fas fa-times"></i>
										</button>
									</div>
								</div>
								<div class="card-body">
									<div class="row">
										<div class="col-md-12">
											<div class="chart">
												<canvas id="monthlyRecapBarChart"
													style="min-height: 250px; height: 250px; max-height: 250px; max-width: 100%;"></canvas>
											</div>
										</div>
									</div>
									<div class="row">
										<div class="col-sm-4 col-6">
											<div class="description-block border-right">
												<span class="description-percentage text-success"><i
														class="fas fa-caret-up"></i> 17%</span>
												<h5 class="description-header">Php 35,210.43</h5>
												<span class="description-text">TOTAL REVENUE</span>
											</div>
											<!-- /.description-block -->
										</div>
										<!-- /.col -->
										<div class="col-sm-4 col-6">
											<div class="description-block border-right">
												<span class="description-percentage text-warning"><i
														class="fas fa-caret-left"></i> 0%</span>
												<h5 class="description-header">Php 10,390.90</h5>
												<span class="description-text">TOTAL COST</span>
											</div>
											<!-- /.description-block -->
										</div>
										<!-- /.col -->
										<div class="col-sm-4 col-6">
											<div class="description-block border-right">
												<span class="description-percentage text-success"><i
														class="fas fa-caret-up"></i> 20%</span>
												<h5 class="description-header">Php 24,813.53</h5>
												<span class="description-text">TOTAL PROFIT</span>
											</div>
											<!-- /.description-block -->
										</div>
									</div>
								</div>
								<!-- /.card-body -->
							</div>
						</div>
					</div>

				</div><!-- /.container-fluid -->
			</section>
			<!-- /.content -->

		</div>
		<!-- /.content-wrapper -->
	</div>
	<!-- ./wrapper -->
	<div th:insert="~{fragments/footer :: footer}"></div>
	<div th:insert="~{fragments/footer-scripts :: footer}"></div>
	<script>
		$(function () {
			
			

			var monthlyBarChartData = {
				labels: ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August','September','October','November','December'],
				datasets: [
					{
						label: 'Revenue',
						backgroundColor: 'rgba(60,141,188,0.9)',
						borderColor: 'rgba(60,141,188,0.8)',
						pointRadius: false,
						pointColor: '#3b8bba',
						pointStrokeColor: 'rgba(60,141,188,1)',
						pointHighlightFill: '#fff',
						pointHighlightStroke: 'rgba(60,141,188,1)',
						data: [10000, 12000, 9000, 20000, 30000, 12000, 40000]
					},
					{
						label: 'Cost',
						backgroundColor: 'rgba(210, 214, 222, 1)',
						borderColor: 'rgba(210, 214, 222, 1)',
						pointRadius: false,
						pointColor: 'rgba(210, 214, 222, 1)',
						pointStrokeColor: '#c1c7d1',
						pointHighlightFill: '#fff',
						pointHighlightStroke: 'rgba(220,220,220,1)',
						data: [5000, 6000, 4500, 10000, 15000, 6000, 20000]
					},
					{
						label: 'Profit',
						backgroundColor: 'rgba(147, 250, 165, 1)',
						borderColor: 'rgba(210, 214, 222, 1)',
						pointRadius: false,
						pointColor: 'rgba(210, 214, 222, 1)',
						pointStrokeColor: '#c1c7d1',
						pointHighlightFill: '#fff',
						pointHighlightStroke: 'rgba(220,220,220,1)',
						data: [5000, 6000, 4500, 10000, 15000, 6000, 20000]
					},
				]
			}

			//-------------
			//- MONTY RECAP BAR CHART -
			//-------------
			var monthlyRecapbarChartCanvas = $('#monthlyRecapBarChart').get(0).getContext('2d')
			var monthlyBarChartDataSet = $.extend(true, {}, monthlyBarChartData)
			var temp0 = monthlyBarChartDataSet.datasets[0]
			var temp1 = monthlyBarChartDataSet.datasets[1]
			monthlyBarChartDataSet.datasets[0] = temp0
			monthlyBarChartDataSet.datasets[1] = temp1

			var ticksStyle = {
				fontColor: '#495057',
				fontStyle: 'bold'
			}

			var monthlyRecapbarChartOptions = {
				responsive: true,
				maintainAspectRatio: false,
				datasetFill: false,
				tooltips: {
					mode: "index",
					intersect: true
				},
				hover: {
					mode: "index",
					intersect: true
				},
				legend: {
					display: true
				},
				scales: {
					yAxes: [{
						ticks: $.extend({
							beginAtZero: true,
							callback: function (value) {
								if (value >= 1000) {
									value /= 1000
									value += 'k'
								}

								return 'Php ' + value;
							}
						}, ticksStyle)
					}]
				}
			}

			new Chart(monthlyRecapbarChartCanvas, {
				type: 'bar',
				data: monthlyBarChartDataSet,
				options: monthlyRecapbarChartOptions
			})

		})

	</script>
</body>

</html>
