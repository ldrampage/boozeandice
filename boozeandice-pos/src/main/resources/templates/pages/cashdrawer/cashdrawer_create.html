<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

<head th:insert="~{fragments/head :: head}"></head>

<body class="hold-transition sidebar-mini layout-fixed">
	<div class="wrapper">

		<!-- Preloader -->
		<div class="preloader flex-column justify-content-center align-items-center">
			<img class="animation__shake" src="dist/img/AdminLTELogo.png" alt="AdminLTELogo" height="60" width="60">
		</div>

		<div th:insert="~{fragments/header :: header}"></div>
		<div th:insert="~{fragments/sidebar :: sidebar}"></div>


		<!-- Content Wrapper. Contains page content -->
		<div class="content-wrapper">
			<!-- Content Header (Page header) -->
			<div class="content-header">
				<div class="container-fluid">
					<div class="row mb-2">
						<div class="col-sm-6">
							<h1 class="m-0">Cash Drawer</h1>
						</div><!-- /.col -->
						<div class="col-sm-6">
							<ol class="breadcrumb float-sm-right">
								<li class="breadcrumb-item"><a href="#">CashDrawer</a></li>
							</ol>
						</div><!-- /.col -->
					</div><!-- /.row -->
				</div><!-- /.container-fluid -->
			</div>
			<!-- /.content-header -->

			<!-- Main content -->
			<section class="content">
				<div class="container-fluid">
					<div class="row justify-content-center">
						<div class="col-lg-12">
							<div class="card">
								<div class="card-header">
									<div class="box_header m-0">
										<div class="main-title">
											<h3 class="m-0">Create Starting Cash for Date: <span
													id="currentDate"></span></h3>
										</div>
									</div>
								</div>
								<div class="card-body">
									<form method="post" th:action="@{/cashdrawer}" enctype="multipart/form-data">
										<div class="row mb-3">
											<div class="col-md-12">
												<label class="form-label" for="starting_cash">Starting cash</label>
												<input type="number" min="5" class="form-control" id="starting_cash"
													name="starting_cash" placeholder="Starting cash" required>
											</div>
										</div>
										<button type="submit" name="createStartingCash"
											class="btn btn-primary">Submit</button>
									</form>
								</div>
							</div>
						</div>
						<div class="col-12">

						</div>
					</div>
				</div><!-- /.container-fluid -->
			</section>
			<!-- /.content -->
		</div>
		<!-- /.content-wrapper -->
	</div>
	<!-- ./wrapper -->
	<div th:insert="~{fragments/footer :: footer}"></div>
	<div th:insert="~{fragments/footer-scripts :: footer}"></div>
	<script>
		// Get the current date
		var currentDate = new Date();

		// Format the date as desired (e.g., "YYYY-MM-DD")
		var formattedDate = currentDate.toISOString().split('T')[0];

		// Update the content of the HTML element with the formatted date
		document.getElementById("currentDate").textContent = formattedDate;
	</script>
</body>

</html>
