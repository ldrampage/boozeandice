<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

<head th:insert="~{fragments/head :: head}"></head>

<body class="crm_body_bg">

	<!-- main content part here -->

	<aside th:insert="~{fragments/sidebar :: sidebar}"></aside>

	<section class="main_content dashboard_part large_header_bg">
		<div th:insert="~{fragments/header :: header}"></div>
		<div class="main_content_iner overly_inner">
			<div class="container-fluid p-0 ">
				<!-- page title  -->
				<div class="row">
					<div class="col-12">
						<div class="page_title_box d-flex align-items-center justify-content-between">
							<div class="page_title_left">
								<h3 class="f_s_30 f_w_700 text_white">Cash Drawer</h3>
								<ol class="breadcrumb page_bradcam mb-0">
									<li class="breadcrumb-item"><a href="javascript:void(0);">Booze and Ice </a></li>
									<li class="breadcrumb-item"><a href="javascript:void(0);">Cash Drawer</a></li>
									<li class="breadcrumb-item"><a href="javascript:void(0);">Create</a></li>

								</ol>
							</div>
						</div>
					</div>
				</div>
				<div class="row justify-content-center">
					<div class="col-lg-12">
						<div class="white_card card_height_100 mb_30">
							<div class="white_card_header">
								<div class="box_header m-0">
									<div class="main-title">
										<h3 class="m-0">Create Starting Cash for Date: <span id="currentDate"></span></h3>
									</div>
								</div>
							</div>
							<div class="white_card_body">
								<div class="card-body">
									<form method="post" th:action="@{/cashdrawer}"
										enctype="multipart/form-data">
										<div class="row mb-3">
											<div class="col-md-12">
												<label class="form-label" for="starting_cash">Starting cash</label>
												<input type="number" min="100" class="form-control" id="starting_cash" name="starting_cash" placeholder="Starting cash" required>
											</div>
										</div>
										<button type="submit" name="createStartingCash" class="btn btn-primary">Submit</button>
									</form>
								</div>
							</div>
						</div>
					</div>
					<div class="col-12">

					</div>
				</div>
			</div>
		</div>

		<!-- footer part -->
		<div th:insert="~{fragments/footer :: footer}"></div>
	</section>
	<!-- main content part end -->

	<div id="back-top" style="display: none;">
		<a title="Go to Top" href="#">
			<i class="ti-angle-up"></i>
		</a>
	</div>
	<div th:insert="~{fragments/footer-scripts :: footer}"></div>
	<script>
		// Get the current date
		var currentDate = new Date();

		// Format the date as desired (e.g., "YYYY-MM-DD")
		var formattedDate = currentDate.toISOString().split('T')[0];

		// Update the content of the HTML element with the formatted date
		document.getElementById("currentDate").textContent = formattedDate;
	</script>
</body>

</html>
