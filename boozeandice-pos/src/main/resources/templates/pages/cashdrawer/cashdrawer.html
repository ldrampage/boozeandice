<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

<head th:insert="~{fragments/head :: head}"></head>

<body class="crm_body_bg">

	<!-- main content part here -->

	<aside th:insert="~{fragments/sidebar :: sidebar}"></aside>

	<section class="main_content dashboard_part large_header_bg">
		<div th:insert="~{fragments/header :: header}"></div>
		<div class="main_content_iner overly_inner">
			<div class="container-fluid p-0 ">
				<!-- page title  -->
				<div class="row">
					<div class="col-12">
						<div class="page_title_box d-flex align-items-center justify-content-between">
							<div class="page_title_left">
								<h3 class="f_s_30 f_w_700 text_white">Cash Drawer</h3>
								<ol class="breadcrumb page_bradcam mb-0">
									<li class="breadcrumb-item"><a href="javascript:void(0);">Booze and Ice </a></li>
									<li class="breadcrumb-item"><a href="javascript:void(0);">Cash Drawer</a></li>
								</ol>
							</div>
						</div>
					</div>
				</div>

				<div class="row">
					<div class="col-lg-6">
						<div class="white_card card_height_100  mb_20">
							<div class="white_card_header">
								<div class="box_header m-0">
									<div class="main-title">
										<h3 class="m-0">Cash Drawer</h3>
									</div>
									<div class="single_wrap_input">
										<select class="nice_Select2 wide" name="" id="">
											<option value="1">Today</option>
										</select>
									</div>
								</div>
							</div>
							<div class="white_card_body">
								<div th:if="${cashDrawerToday != null}" class="row">
									<div class="col-lg-12">
										<table class="table">
											<tbody>
												<tr>
													<td>
														<h5 class="byer_name  f_s_16 f_w_600 color_theme2">Starting
															Cash
														</h5>
														<h3 class="color_gray f_w_700 "
															th:text="${'Php ' + cashDrawerToday.startingCash}"></h3>
													</td>
													<!--<form method="post" th:action="@{/cashdrawer}">
														<td style="text-align: center;">

															<input type="number" class="form-control"
																th:value="${cashDrawerToday.startingCash}" step="100"
																id="starting_cash" name="starting_cash" />

														</td>
														<td>
															<button type="submit" name="editStartingCash"
																class="btn btn-outline-success mb-3">
																<i
																		class="fas fa-shopping-bag font_s_18"></i>
																EDIT
															</button>
														</td>
													</form> -->
												</tr>
											</tbody>
										</table>
										<table class="table">
											<tbody>
												<tr>
													<td>
														<h5 class="byer_name  f_s_16 f_w_600 color_theme2">Cash added
														</h5>
														<h3 class="color_gray f_w_700 "
															th:text="${'Php ' + cashDrawerToday.totalCashAdded}"></h3>
													</td>
													<form method="post" th:action="@{/cashdrawer}">
														<td style="text-align: center;">

															<input type="number" class="form-control" step="100" id="add_cash" name="add_cash" required/>

														</td>
														<td>
															<button type="submit" name="add_cash_btn"
																class="btn btn-outline-success mb-3">
																<!--<i
																		class="fas fa-shopping-bag font_s_18"></i>-->
																ADD CASH
															</button>
														</td>
													</form>
												</tr>
											</tbody>
										</table>
										<table class="table">
											<tbody>
												<tr>
													<td>
														<h5 class="byer_name  f_s_16 f_w_600 color_theme2">Expenses</h5>
														<h3 class="color_gray f_w_700 "
															th:text="${'Php ' + cashDrawerToday.totalExpenses}"></h3>
													</td>
												</tr>
											</tbody>
										</table>
										<table class="table">
											<tbody>
												<tr>
													<td>
														<h5 class="byer_name  f_s_16 f_w_600 color_theme2">Cash Sales
															Since</h5>
														<h3 class="color_gray f_w_700 " th:if="${cashDrawerToday.totalCashSales > 0}" th:text="${'Php ' + cashDrawerToday.totalCashSales}"></h3>
														<h3 class="color_gray f_w_700 " th:unless="${cashDrawerToday.totalCashSales > 0}">Php 0.0</h3>

													</td>
												</tr>
											</tbody>
										</table>
										
										<table class="table">
											<tbody>
												<tr>
													<td>
														<h5 class="byer_name  f_s_16 f_w_600 color_theme2">Total Cash</h5>
														<h3 class="color_gray f_w_700 " th:if="${cashDrawerToday.totalCashInDrawer > 0}" th:text="${'Php ' + cashDrawerToday.totalCashInDrawer}"></h3>
														<h3 class="color_gray f_w_700 " th:unless="${cashDrawerToday.totalCashInDrawer > 0}">Php 0.0</h3>

													</td>
												</tr>
											</tbody>
										</table>
										<div class="single_update_news">

										</div>
										<!--<div class="single_update_news">
											<h5 class="byer_name  f_s_16 f_w_600 color_theme2">Non-Cash Sales</h5>
											<h3 class="color_gray f_w_700 ">Php 200.00</h3>
										</div> -->
									</div>
								</div>
								<div th:unless="${cashDrawerToday != null}" class="row">
									<div class="col-lg-12">
										<form method="post" th:action="@{/cashdrawer}">
											<h2 class="color_gray f_w_700" style="text-align: center;">Create Starting
												Cash for Today</h2>
											<a th:href="${'/cashdrawer/create'}" type="submit" name="cash_payment"
												class="btn_2 mt-1 mb-1 w-100" style="text-align: center;">Create</a>
										</form>
									</div>
								</div>
							</div>
						</div>
					</div>

					<div th:if="${cashDrawerToday != null}" class="col-lg-6">
						<div class="white_card card_height_100  mb_20">
							<div class="white_card_header">
								<div class="box_header m-0">
									<div class="main-title">
										<h3 class="m-0">Expenses</h3>
									</div>
									<!--<div class="single_wrap_input">
										<select class="nice_Select2 wide" name="" id="">
											<option value="1">Today</option>
										</select>
									</div> -->
								</div>
							</div>
							<div class="white_card_body">
								<form method="post" th:action="@{/cashdrawer}">
									<div class="row">
										<div class="col-lg-6">
											<div class="form-group">
												<label for="expense_amount">Expense</label>
												<input type="number" class="form-control" id="expense_amount" name="expense_amount"
													placeholder="Expense Amount" required />
											</div>
										</div>
										<div class="col-lg-6">
											<div class="form-group">
												<label for="expense_reason">Notes</label>
												<textarea type="number" class="form-control" id="expense_reason" name="expense_reason"
													placeholder="Enter expense reason" required></textarea>
											</div>
										</div>
										<div class="col-lg-6">
											<div class="form-group">
												<input type="submit" name="add_expense" value="Add New Expense"
													class="btn btn-md btn-success" />
											</div>
										</div>
									</div>
								</form>

								<div class="row">
									<div class="col-lg-12">
										<div class="table-responsive">
											<table class="table">
												<thead>
													<tr>
														<th scope="col">#</th>
														<th scope="col">Expense</th>
														<th scope="col">Date Created</th>
														<th scope="col">Notes</th>
													</tr>
												</thead>
												<tbody>
													<tr th:each="expense : ${expenseList}">
														<th scope="row"><span th:text="${expense.id}"></span></th>
														<td><span th:text="${'Php ' + expense.expense}"></span></td>
														<td><span th:text="${expense.createdDate}"></span></td>
														<td><span th:text="${expense.note}"></span></td>
													</tr>
												</tbody>
											</table>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>

		<!-- footer part -->
		<div th:insert="~{fragments/footer :: footer}"></div>
	</section>
	<!-- main content part end -->

	<div id="back-top" style="display: none;">
		<a title="Go to Top" href="#">
			<i class="ti-angle-up"></i>
		</a>
	</div>
	<div th:insert="~{fragments/footer-scripts :: footer}"></div>
</body>

</html>
