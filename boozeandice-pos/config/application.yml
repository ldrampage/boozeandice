server:
  port: 8080
  address: lyndon

spring:
  profiles:
    active: dev
  application:
    name: boozeandice
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB
      enabled: true
  pid:
    fail-on-write-error: true
    file: ./logs/boozeandicepos.pid
  sql:
    init:
      mode: never
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      minimum-idle: 5
      maximum-pool-size: 50
      auto-commit: true
      pool-name: BoozeandiceHikariPool
      connection-test-query: select 1 from dual
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000 


#application settings
business_name: Booze and Ice
senior_citizen_discount: 0.20 #20 PERCENT SENIOR CITIZEN DISCOUNT
productSilogCategory: 'silog meals'
available_tables: 6

#img upload location
upload:
  product:
    directory: C:\Projects\boozeandicepos\boozeandice-pos\boozeandice\boozeandice-pos\img\products
  profile:
    directory: C:\Projects\boozeandicepos\boozeandice-pos\boozeandice\boozeandice-pos\img\profile
  barcode:
    directory: C:\Projects\boozeandicepos\boozeandice-pos\boozeandice\boozeandice-pos\img\barcodes
  
logging:
  level:
    root: INFO
    org:
      hibernate: INFO
    com:
      boozeandice: DEBUG
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%p %thread %F:%L] %msg%n'
    file: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%p %thread %F:%L] %msg%n'
  file:
    path: 'C:\workspace\loggers\boozeandice'
    name: '${logging.file.path}/${spring.profiles.active}.${spring.application.name}-${date:yyyy-MM-dd}.log'

